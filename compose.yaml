services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:1.5b"]
    restart: "no"

  api:
    build: .
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    environment:
      AI_PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      DATABASE_URL: sqlite:////app/state/opspilot.db
    ports:
      - "8000:7860"
    volumes:
      - opspilot_data:/app/state
      - embedding_cache:/app/model-cache

volumes:
  ollama_models:
  opspilot_data:
  embedding_cache:
